buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

tasks.named('wrapper') {
    gradleVersion = '8.7'
    distributionType = Wrapper.DistributionType.BIN
}
